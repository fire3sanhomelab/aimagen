version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile
    container_name: aimagen-backend
    expose:
      - "3456"
    environment:
      - PORT=3456
      - AI_IMAGE_PROVIDER=${AI_IMAGE_PROVIDER:-opencode-go}
      - OLLAMA_URL=${OLLAMA_URL:-http://host.docker.internal:11434}
      - LLM_STUDIO_URL=${LLM_STUDIO_URL:-http://host.docker.internal:1234}
      - COMFYUI_URL=${COMFYUI_URL:-http://host.docker.internal:8188}
      - JANUS_PRO_URL=${JANUS_PRO_URL:-http://host.docker.internal:8000}
      - OPENCODE_API_KEY=${OPENCODE_API_KEY:-}
    volumes:
      - ./backend/data:/app/data
      - ./backend/uploads:/app/uploads
      - ./backend/public/gallery:/app/public/gallery
    restart: unless-stopped
    networks:
      - proxy-network
    labels:
      - "traefik.enable=false"

  frontend:
    build:
      context: ./frontend
      dockerfile: docker/Dockerfile
    container_name: aimagen
    expose:
      - "80"
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    networks:
      - proxy-network
    depends_on:
      - backend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.aimagen.rule=Host(`homelab.fire3san.duckdns.org`) && PathPrefix(`/aimagen`)"
      - "traefik.http.routers.aimagen.middlewares=auto-strip-prefix@file"
      - "traefik.http.services.aimagen.loadbalancer.server.port=80"

networks:
  proxy-network:
    external: true
